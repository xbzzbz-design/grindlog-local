<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0C0906"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="GrindLog"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <title>GrindLog</title>
  <script>
    (() => {
      const DB_NAME = 'grindlog';
      const DB_VERSION = 2;
      const STORE = 'entries';
      const MIRROR_KEY = 'grindlog_entries_mirror_v1';

      function openDb() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) {
            reject(new Error('IndexedDB is unavailable'));
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE)) {
              const store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
              store.createIndex('beanName', 'beanName');
              store.createIndex('createdAt', 'createdAt');
              store.createIndex('lastGroundAt', 'lastGroundAt');
              return;
            }
            const store = req.transaction.objectStore(STORE);
            if (!store.indexNames.contains('lastGroundAt')) store.createIndex('lastGroundAt', 'lastGroundAt');
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function txDone(tx) {
        return new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onabort = () => reject(tx.error);
          tx.onerror = () => reject(tx.error);
        });
      }

      async function readEntries(db) {
        return new Promise((resolve, reject) => {
          const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
          req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
          req.onerror = () => reject(req.error);
        });
      }

      async function restoreFromMirror(db) {
        const mirrored = JSON.parse(localStorage.getItem(MIRROR_KEY) || '[]');
        if (!Array.isArray(mirrored) || mirrored.length === 0) return;
        const existing = await readEntries(db);
        const existingIds = new Set(existing.map(entry => entry.id));
        const missing = mirrored.filter(entry => entry && entry.id != null && !existingIds.has(entry.id));
        if (missing.length === 0) return;
        const tx = db.transaction(STORE, 'readwrite');
        const store = tx.objectStore(STORE);
        missing.forEach(entry => store.put(entry));
        await txDone(tx);
      }

      async function mirrorEntries() {
        let db;
        try {
          db = await openDb();
          const entries = await readEntries(db);
          if (entries.length > 0) localStorage.setItem(MIRROR_KEY, JSON.stringify(entries));
        } catch {
          // Best-effort fallback only; the app still uses IndexedDB as the source of truth.
        } finally {
          if (db) db.close();
        }
      }

      ['add', 'put', 'delete', 'clear'].forEach(method => {
        const original = IDBObjectStore.prototype[method];
        IDBObjectStore.prototype[method] = function(...args) {
          if (this.name === STORE && this.transaction.mode === 'readwrite' && !this.transaction.__grindlogMirrors) {
            this.transaction.__grindlogMirrors = true;
            this.transaction.addEventListener('complete', () => window.dispatchEvent(new Event('grindlog:mirror')), { once: true });
          }
          return original.apply(this, args);
        };
      });

      window.__grindlogRestoreReady = (async () => {
        let db;
        try {
          db = await openDb();
          await restoreFromMirror(db);
        } catch {
          // Keep startup resilient even if the fallback cannot run.
        } finally {
          if (db) db.close();
        }
      })();

      const scheduleMirror = () => setTimeout(mirrorEntries, 250);
      window.addEventListener('grindlog:mirror', scheduleMirror);
      window.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') mirrorEntries();
      });
      window.addEventListener('pagehide', mirrorEntries);
      setInterval(mirrorEntries, 3000);
    })();
  </script>
  <script type="module" crossorigin>
    await window.__grindlogRestoreReady;
    await import('/grindlog-local/assets/index-Dugmg5Au.js');
  </script>
  <link rel="stylesheet" crossorigin href="/grindlog-local/assets/index-WtXxLoQR.css">
<link rel="manifest" href="/grindlog-local/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/grindlog-local/registerSW.js"></script></head>
<body class="bg-bg overflow-hidden">
  <div id="root"></div>
</body>
</html>
