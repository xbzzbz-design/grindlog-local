function roastInfo(roastDateStr) {
  const d = new Date(roastDateStr);
  const days = Math.max(0, Math.floor((TODAY - d) / 86400000));
  let status, pct, label;
  if (days < 7)       { status='resting'; label='Resting';     pct = days/7*0.33; }
  else if (days <= 21){ status='peak';    label='Peak window'; pct = 0.33+(days-7)/14*0.34; }
  else if (days <= 35){ status='mature';  label='Mature';      pct = 0.67+(days-21)/14*0.2; }
  else                { status='past';    label='Past peak';   pct = Math.min(1,0.87+(days-35)/30*0.13); }
  const daysToPeak = days < 7 ? 7 - days : null;
  const daysToPast = (days>=7 && days<=21) ? 21-days : null;
  return { days, status, label, pct, daysToPeak, daysToPast };
}

function formatRoastDate(s) {
  return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function formatBrewDate(s) {
  const diff = Math.floor((TODAY - new Date(s)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7)  return `${diff}d ago`;
  return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function pricePerGram(bean) {
  if (!bean.pricePaid || !bean.weightBought) return null;
  return bean.pricePaid / bean.weightBought;
}
function pricePerShot(bean, dose=ESPRESSO_DOSE) {
  const pg = pricePerGram(bean);
  return pg == null ? null : pg * dose;
}
function formatYen(n) {
  if (n == null || !Number.isFinite(n)) return '—';
  return '฿' + Math.round(n).toLocaleString('en-US');
}
function formatYenFine(n) {
  if (n == null || !Number.isFinite(n)) return '—';
  return '฿' + (Math.round(n*10)/10).toFixed(1);
}
// Treat placeholder em-dashes as empty so sparse beans don't show stray dashes
const realVal  = v => (v && v !== '—') ? v : null;
const joinReal = (arr, sep) => arr.map(realVal).filter(Boolean).join(sep);
function comingIntoPeak(beans) {
  return beans
    .map(bean => ({ bean, info: roastInfo(bean.roastDate) }))
    .filter(({info}) => info.daysToPeak != null && info.daysToPeak <= 6)
    .sort((a,b) => a.info.daysToPeak - b.info.daysToPeak);
}

function suggestGrind(bean) {
  const pts = [];
  (bean.bags || []).forEach(bag => {
    const roast = new Date(bag.roastDate);
    (bag.brews || []).forEach(brew => {
      const days = Math.floor((new Date(brew.date) - roast) / 86400000);
      const g = parseFloat(brew.grind);
      if (!isNaN(g) && days >= 0) pts.push({ days, grind: g });
    });
  });
  const roast = new Date(bean.roastDate);
  (bean.brews || []).forEach(brew => {
    const days = Math.floor((new Date(brew.date) - roast) / 86400000);
    const g = parseFloat(brew.grind);
    if (!isNaN(g) && days >= 0) pts.push({ days, grind: g });
  });
  if (pts.length < 2) return null;
  const n  = pts.length;
  const mx = pts.reduce((s,p)=>s+p.days,0)/n;
  const my = pts.reduce((s,p)=>s+p.grind,0)/n;
  const num = pts.reduce((s,p)=>s+(p.days-mx)*(p.grind-my),0);
  const den = pts.reduce((s,p)=>s+(p.days-mx)**2,0);
  const todayDays = Math.floor((TODAY - new Date(bean.roastDate))/86400000);
  if (den===0) return { suggested: Math.round(Math.max(0.5,Math.min(11,my))*10)/10, dataPoints: n, bags: (bean.bags||[]).length };
  const slope = num/den;
  const raw = my - slope*(mx - todayDays);
  const suggested = Math.round(Math.max(0.5,Math.min(11,raw))*10)/10;
  return { suggested, dataPoints: n, bags: (bean.bags||[]).length };
}

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function shortDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`;
}

                  color:filter===t?jp.ink:jp.ink3,fontWeight:filter===t?600:400,cursor:'pointer',position:'relative',

              const lastBrew = bean.brews && bean.brews.length > 0 ? bean.brews[0] : null;
              const suggest  = suggestGrind(bean);
              const origin  = joinReal([bean.origin, bean.region], ' · ');
              const source  = joinReal([bean.roaster, bean.process], ' — ');
              // Fallbacks for sparse beans: last grind / today's estimate
              const line1 = origin
                || (lastBrew ? `Grind ${lastBrew.grind} · ${shortDate(lastBrew.date)}` : realVal(bean.roastLevel) || '');
              const line2 = source
                || (suggest ? `Today est. ${suggest.suggested}` : lastBrew ? `Grind ${lastBrew.grind}` : '');
              return (
                <div key={bean.id} className="jp-tap" onClick={()=>onOpen(bean.id)} style={{
                  display:'flex',gap:18,padding:'20px 0',
                  borderBottom:`1px solid ${jp.rule}`,cursor:'pointer',alignItems:'flex-start',
                }}>
                  <JPBeanPhoto bean={bean} size={72}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8}}>
                      <div style={{fontFamily:jp.serif,fontSize:22,lineHeight:1.1,color:jp.ink,letterSpacing:-.2}}>{bean.name}</div>
                      <div style={{fontFamily:jp.mono,fontSize:11,color:jp.ink3,letterSpacing:.5,flexShrink:0}}>{String(i+1).padStart(2,'0')}</div>
                    </div>
                    {line1 && <div style={{fontFamily:jp.serif,fontSize:14,fontStyle:'italic',color:jp.ink2,marginTop:2}}>
                      {line1}
                    </div>}
                    {line2 && <div style={{fontFamily:jp.sans,fontSize:11,color:jp.ink3,marginTop:6,letterSpacing:.3}}>
                      {line2}
                    </div>}
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10}}>
                      <div style={{display:'flex',gap:8,alignItems:'center'}}>
                        <JPStatusPill status={r.status} label={`${r.label} · ${r.days}d`} small/>
                      </div>
                      <JPStars rating={bean.rating} size={11}/>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* FAB — outside scroll, sticks to visible bottom */}
      <button className="jp-tap" onClick={onAdd} style={{
        position:'absolute',bottom:32,right:24,zIndex:10,
        width:62,height:62,borderRadius:'50%',
        background:jp.ink,color:jp.paper,border:'none',cursor:'pointer',
        display:'flex',alignItems:'center',justifyContent:'center',
        boxShadow:'0 8px 24px rgba(26,22,20,.25),0 2px 6px rgba(26,22,20,.18)',
        fontFamily:jp.serif,fontSize:32,lineHeight:1,paddingBottom:4,
      }}>+</button>
    </div>
  );
}

// ─── Grind trend chart ──────────────────────────────────────────────────────
function JPGrindChart({ bean }) {
  const pts = [];
  (bean.bags||[]).forEach(bag => {
    const roast = new Date(bag.roastDate);
    (bag.brews||[]).forEach(brew => {
      const days = Math.floor((new Date(brew.date)-roast)/86400000);
      const g = parseFloat(brew.grind);
      if (!isNaN(g) && days>=0) pts.push({days,grind:g,past:true});
    });
  });
  const roast = new Date(bean.roastDate);
  (bean.brews||[]).forEach(brew => {
    const days = Math.floor((new Date(brew.date)-roast)/86400000);
    const g = parseFloat(brew.grind);
    if (!isNaN(g) && days>=0) pts.push({days,grind:g,past:false});
  });
  if (pts.length < 2) return null;

  const suggest = suggestGrind(bean);
  const todayDays = Math.floor((TODAY-new Date(bean.roastDate))/86400000);
  const xs = pts.map(p=>p.days), ys = pts.map(p=>p.grind);
  const minX=Math.min(...xs), maxX=Math.max(Math.max(...xs),todayDays);
  const minY=Math.min(...ys)-0.2, maxY=Math.max(...ys)+0.2;
  const rX=maxX-minX||1, rY=maxY-minY||0.5;
  const W=100,H=64,pad={l:22,r:10,t:6,b:18};
  const iW=W-pad.l-pad.r, iH=H-pad.t-pad.b;
  const px=d=>pad.l+((d-minX)/rX)*iW;
  const py=g=>pad.t+iH-((g-minY)/rY)*iH;

  let line=null;
  if (suggest && pts.length>=2) {
    const n=pts.length, mx=xs.reduce((s,x)=>s+x,0)/n, my=ys.reduce((s,y)=>s+y,0)/n;
    const num=pts.reduce((s,p)=>s+(p.days-mx)*(p.grind-my),0);
    const den=pts.reduce((s,p)=>s+(p.days-mx)**2,0);
    if (den!==0){const sl=num/den,ic=my-sl*mx;line={x1:px(minX),y1:py(ic+sl*minX),x2:px(maxX),y2:py(ic+sl*maxX)};}
  }

  const yStep=rY>0.7?0.5:0.2;
  const yTicks=[];
  for(let y=Math.ceil((minY+0.05)/yStep)*yStep;y<=maxY-0.05;y+=yStep) yTicks.push(Math.round(y*10)/10);

  return (
    <div style={{padding:'28px 24px 0'}}>
      <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3,marginBottom:12,display:'flex',gap:8,alignItems:'center'}}>
        Grind Trend
        {(bean.bags||[]).length>0&&<span style={{opacity:.55,fontSize:9,fontWeight:400}}>· cross-bag</span>}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',overflow:'visible',display:'block'}}>
        {yTicks.map(y=>(
          <g key={y}>
            <line x1={pad.l} y1={py(y)} x2={W-pad.r} y2={py(y)} stroke={jp.rule} strokeWidth=".3"/>
            <text x={pad.l-3} y={py(y)} textAnchor="end" dominantBaseline="middle" fill={jp.ink3} fontSize="4" fontFamily="'JetBrains Mono',monospace">{y}</text>
          </g>
        ))}
        {line&&<line {...line} stroke={jp.ink} strokeWidth=".7" strokeDasharray="1.5 1" opacity=".28"/>}
        {suggest&&<>
          <line x1={px(todayDays)} y1={pad.t} x2={px(todayDays)} y2={pad.t+iH} stroke={jp.peak} strokeWidth=".4" strokeDasharray="1 1" opacity=".5"/>
          <circle cx={px(todayDays)} cy={py(suggest.suggested)} r="2" fill={jp.peak}/>
          <text x={px(todayDays)+2.5} y={py(suggest.suggested)} dominantBaseline="middle" fill={jp.peak} fontSize="3.5" fontFamily="'JetBrains Mono',monospace">{suggest.suggested}</text>
        </>}
        {pts.map((p,i)=>(
          <circle key={i} cx={px(p.days)} cy={py(p.grind)} r="1.6"
            fill={p.past?'transparent':jp.ink} stroke={jp.ink} strokeWidth={p.past?.5:.3} opacity={p.past?.42:1}/>
        ))}
        <line x1={pad.l} y1={pad.t+iH} x2={W-pad.r} y2={pad.t+iH} stroke={jp.rule} strokeWidth=".4"/>
        <text x={pad.l} y={H-1} fill={jp.ink3} fontSize="3.5" fontFamily="'JetBrains Mono',monospace">D+{minX}</text>
        <text x={W-pad.r} y={H-1} textAnchor="end" fill={jp.ink3} fontSize="3.5" fontFamily="'JetBrains Mono',monospace">D+{maxX}</text>
      </svg>
      <div style={{display:'flex',gap:14,marginTop:10}}>
        <span style={{display:'flex',alignItems:'center',gap:4,fontFamily:jp.sans,fontSize:9,letterSpacing:1.2,textTransform:'uppercase',color:jp.ink3}}>
          <span style={{width:6,height:6,borderRadius:'50%',background:jp.ink,display:'inline-block'}}/>This bag
        </span>
        {(bean.bags||[]).length>0&&(
          <span style={{display:'flex',alignItems:'center',gap:4,fontFamily:jp.sans,fontSize:9,letterSpacing:1.2,textTransform:'uppercase',color:jp.ink3}}>
            <span style={{width:6,height:6,borderRadius:'50%',border:`1px solid ${jp.ink}`,display:'inline-block',opacity:.42}}/>Past
          </span>
        )}
        {suggest&&(
          <span style={{display:'flex',alignItems:'center',gap:4,fontFamily:jp.sans,fontSize:9,letterSpacing:1.2,textTransform:'uppercase',color:jp.peak}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:jp.peak,display:'inline-block'}}/>Today
          </span>
        )}
      </div>
    </div>
  );
}

              {[...(bean.bags||[])].reverse().map((bag,i,arr)=>{
                const ppg = bag.pricePaid&&bag.weightBought ? bag.pricePaid/bag.weightBought : null;
                const bagNum = arr.length - i;

                  <div key={bag.id} style={{
                    padding:'14px 16px',marginBottom:8,borderRadius:2,

                  }}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>
                      <span style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3}}>
                        Bag #{bagNum} · {formatRoastDate(bag.roastDate)}
                      </span>
                      <span style={{fontFamily:jp.mono,fontSize:10,color:jp.ink3}}>
                        {(bag.brews||[]).length} brew{(bag.brews||[]).length!==1?'s':''}
                      </span>

                    <div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
                      <div>
                        <div style={{fontFamily:jp.serif,fontSize:16,color:jp.ink}}>{bag.weightBought}g</div>

                      </div>

                      </div>

                      </div>}

                        <div style={{fontFamily:jp.serif,fontSize:16,color:jp.ink}}>{formatYen(ppg*ESPRESSO_DOSE)}/shot</div>
                        <div style={{fontFamily:jp.sans,fontSize:9,color:jp.ink3,marginTop:1,letterSpacing:1.4,textTransform:'uppercase'}}>Per shot</div>
                      </div>}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : <div style={{height:56}}/>}
        </div>
      </div>
    </div>
  );
}

          left={step==='gallery'
            ? <button onClick={onClose} className="jp-tap" style={{background:'transparent',border:'none',cursor:'pointer',color:jp.ink,fontFamily:jp.sans,fontSize:13,padding:0}}>Close</button>
            : <button onClick={stepBack} className="jp-tap" style={{background:'transparent',border:'none',cursor:'pointer',color:jp.ink,fontFamily:jp.sans,fontSize:13,padding:0}}>← Back</button>
          }
          center={centerLabel}
          right={null}
        />
        <div style={{flex:1,overflow:'hidden',position:'relative'}}>
          {step==='gallery' && (
            <JPGallery onPick={p=>{ setSelected(p); setStep('crop'); }}/>
          )}
          {step==='crop' && selected && (
            <JPCrop photo={selected} onDone={url=>{
              setFinalPhoto({ ...selected, imageUrl: url });
              setStep('filter');
            }}/>
          )}
          {step==='filter' && finalPhoto && (
            <JPFilter photo={finalPhoto} useFilter={useFilter} setUseFilter={setUseFilter} onNext={()=>setStep('form')}/>
          )}
          {step==='form' && finalPhoto && (
            <JPForm photo={finalPhoto} useFilter={useFilter} onSave={onAddBean} allRoasters={allRoasters}/>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Crop ────────────────────────────────────────────────────────────────────
// Output aspect ratio for cropped bean photos
const CROP_W = 800, CROP_H = 1000;   // 4:5

// House filter — baked into the saved image so the choice actually persists
const HOUSE_FILTER = 'sepia(.22) saturate(1.18) contrast(.94) brightness(.97)';
function bakeFilter(dataUrl) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        if (ctx && 'filter' in ctx) {
          ctx.filter = HOUSE_FILTER;
          ctx.drawImage(img, 0, 0);
          resolve(canvas.toDataURL('image/jpeg', 0.9));
        } else {
          resolve(dataUrl);   // ctx.filter unsupported → keep original
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    } catch { resolve(dataUrl); }
  });
}
function JPCrop({ photo, onDone }) {
  const areaRef  = React.useRef(null);   // available dark space
  const frameRef = React.useRef(null);   // the actual 4:5 crop window
  const imgRef   = React.useRef(null);
  const drag     = React.useRef(null);
  const [pos,     setPos]     = React.useState({ x:0, y:0, scale:1 });
  const [frame,   setFrame]   = React.useState(null);   // { w, h } — always 4:5
  const [imgBase, setImgBase] = React.useState(null);   // image size at cover scale

  // Size the 4:5 frame to the largest box that fits the available area
  React.useEffect(() => {
    const measureFrame = () => {
      const a = areaRef.current;
      if (!a) return;
      const aW = a.clientWidth, aH = a.clientHeight;
      if (!aW || !aH) return;
      let w = aW, h = aW * CROP_H / CROP_W;
      if (h > aH) { h = aH; w = aH * CROP_W / CROP_H; }
      setFrame({ w, h });
    };
    measureFrame();
    window.addEventListener('resize', measureFrame);
    return () => window.removeEventListener('resize', measureFrame);
  }, []);

  // Compute the cover scale once we know both the frame and the image
  const measureImg = React.useCallback(() => {
    const img = imgRef.current;
    if (!img || !img.naturalWidth || !frame) return;
    const bs = Math.max(frame.w / img.naturalWidth, frame.h / img.naturalHeight);
    setImgBase({ w: img.naturalWidth * bs, h: img.naturalHeight * bs, bs });
  }, [frame]);
  React.useEffect(() => { measureImg(); }, [frame, measureImg]);

  // Keep the image always covering the frame (no gaps → no aspect distortion)
  const clampPos = (p, base) => {
    if (!frame || !base) return p;
    const rendW = base.w * p.scale;
    const rendH = base.h * p.scale;
    const maxX = Math.max(0, (rendW - frame.w) / 2);
    const maxY = Math.max(0, (rendH - frame.h) / 2);
    return {
      scale: p.scale,
      x: Math.max(-maxX, Math.min(maxX, p.x)),
      y: Math.max(-maxY, Math.min(maxY, p.y)),
    };
  };

  // Non-passive touchmove to prevent page scroll during crop
  const moveHandlerRef = React.useRef(null);
  moveHandlerRef.current = (e) => {
    e.preventDefault();
    if (!drag.current) return;
    if (drag.current.type === 'pan' && e.touches.length === 1) {
      const dx = e.touches[0].clientX - drag.current.x;
      const dy = e.touches[0].clientY - drag.current.y;
      drag.current.x = e.touches[0].clientX;
      drag.current.y = e.touches[0].clientY;
      setPos(p => clampPos({ ...p, x: p.x + dx, y: p.y + dy }, imgBase));
    } else if (drag.current.type === 'pinch' && e.touches.length === 2) {
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const ratio = d / drag.current.d;
      drag.current.d = d;
      setPos(p => clampPos({ ...p, scale: Math.max(1, Math.min(8, p.scale * ratio)) }, imgBase));
    }
  };

  React.useEffect(() => {
    const el = frameRef.current;
    if (!el) return;
    const fn = (e) => moveHandlerRef.current(e);
    el.addEventListener('touchmove', fn, { passive: false });
    return () => el.removeEventListener('touchmove', fn);
  }, [frame]);

  const onTouchStart = (e) => {
    if (e.touches.length === 1) {
      drag.current = { type:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      drag.current = { type:'pinch', d:Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      )};
    }
  };
  const onTouchEnd = () => { drag.current = null; };

  const applyCrop = () => {
    const img = imgRef.current;
    if (!img || !imgBase || !frame) { onDone(photo.imageUrl); return; }
    const totalScale = imgBase.bs * pos.scale;
    const rendW = img.naturalWidth  * totalScale;
    const rendH = img.naturalHeight * totalScale;
    const imgLeft = frame.w/2 + pos.x - rendW/2;
    const imgTop  = frame.h/2 + pos.y - rendH/2;
    // Frame is exactly 4:5 and always covered, so the source rect is 4:5 too
    const sx = Math.max(0, -imgLeft / totalScale);
    const sy = Math.max(0, -imgTop  / totalScale);
    const sw = frame.w / totalScale;
    const sh = frame.h / totalScale;
    const canvas = document.createElement('canvas');
    canvas.width = CROP_W; canvas.height = CROP_H;
    canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, CROP_W, CROP_H);
    onDone(canvas.toDataURL('image/jpeg', 0.9));
  };

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'4px 24px 10px',fontFamily:jp.serif,fontStyle:'italic',fontSize:14,color:jp.ink2}}>
        Drag to reposition · pinch to zoom
      </div>
      <div ref={areaRef} style={{flex:1,overflow:'hidden',background:'#111',display:'flex',alignItems:'center',justifyContent:'center'}}>
        {frame && (
          <div
            ref={frameRef}
            onTouchStart={onTouchStart}
            onTouchEnd={onTouchEnd}
            style={{position:'relative',overflow:'hidden',width:frame.w,height:frame.h,touchAction:'none',cursor:'grab'}}
          >
            <img
              ref={imgRef}
              src={photo.imageUrl}
              crossOrigin="anonymous"
              onLoad={measureImg}
              style={{
                position:'absolute', top:'50%', left:'50%', maxWidth:'none', pointerEvents:'none',
                width:  imgBase ? imgBase.w : 'auto',
                height: imgBase ? imgBase.h : 'auto',
                opacity: imgBase ? 1 : 0,
                transform: `translate(calc(-50% + ${pos.x}px), calc(-50% + ${pos.y}px)) scale(${pos.scale})`,
                transformOrigin:'center center',
              }}
            />
            {/* Rule-of-thirds grid */}
            <div style={{position:'absolute',inset:0,pointerEvents:'none'}}>
              {[33.33,66.66].map(p=>(
                <React.Fragment key={p}>
                  <div style={{position:'absolute',top:`${p}%`,left:0,right:0,height:1,background:'rgba(255,255,255,.25)'}}/>
                  <div style={{position:'absolute',left:`${p}%`,top:0,bottom:0,width:1,background:'rgba(255,255,255,.25)'}}/>
                </React.Fragment>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{padding:'14px 24px 24px',display:'flex',gap:10}}>
        <button onClick={()=>onDone(photo.imageUrl)} style={{
          flex:1,height:44,background:'transparent',color:jp.ink2,
          border:`1px solid ${jp.rule}`,borderRadius:2,cursor:'pointer',
          fontFamily:jp.sans,fontSize:11,letterSpacing:2,textTransform:'uppercase',
        }}>Skip</button>
        <button onClick={applyCrop} className="jp-tap" style={{
          flex:2,height:44,background:jp.ink,color:jp.paper,
          border:'none',borderRadius:2,cursor:'pointer',
          fontFamily:jp.sans,fontSize:12,letterSpacing:2,textTransform:'uppercase',
        }}>Crop & Continue</button>
      </div>
    </div>
  );
}

function JPForm({ photo, useFilter, onSave, allRoasters }) {
  const [name,       setName]       = React.useState('');
  const [roaster,    setRoaster]    = React.useState('');
  const [roastDate,  setRoastDate]  = React.useState('');
  const [roastLevel, setRoastLevel] = React.useState('');
  const [grams,      setGrams]      = React.useState('');
  const [price,      setPrice]      = React.useState('');
  const [rating,     setRating]     = React.useState(0);
  const [notes,      setNotes]      = React.useState([]);
  const [noteInput,  setNoteInput]  = React.useState('');
  const [showDrop,   setShowDrop]   = React.useState(false);

  const filtered = (allRoasters||[]).filter(r =>
    r.toLowerCase().includes(roaster.toLowerCase()) && r.toLowerCase()!==roaster.toLowerCase()
  );

  const addNote = () => {
    const v = noteInput.trim().replace(/^#/,'').replace(/,/g,'').trim();
    if (v && !notes.find(n=>n.toLowerCase()===v.toLowerCase())) setNotes(ns=>[...ns,v]);
    setNoteInput('');
  };

  const [saving, setSaving] = React.useState(false);
  const save = async () => {
    if (!name.trim() || saving) return;
    setSaving(true);
    const imageUrl = (useFilter && photo.imageUrl)
      ? await bakeFilter(photo.imageUrl)
      : photo.imageUrl;
    onSave({
      name:         name.trim(),
      roaster:      roaster.trim() || '—',
      roastDate:    roastDate || todayISO(),
      roastLevel:   roastLevel || '—',
      gramsLeft:    parseFloat(grams) || 0,
      weightBought: parseFloat(grams) || 0,
      pricePaid:    parseFloat(price) || 0,
      rating,
      notes,
      imageUrl,
    });
  };

  return (
    <div style={{padding:'12px 24px 24px',overflowY:'auto',height:'100%'}}>
      <div style={{display:'flex',gap:16,alignItems:'flex-start',marginBottom:16}}>

        <div style={{flex:1,paddingTop:4}}>
          <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3}}>Photo</div>
          <div style={{fontFamily:jp.serif,fontStyle:'italic',fontSize:14,color:jp.ink2,marginTop:4}}>{useFilter?'House filter · warm':'Original'}</div>
        </div>
      </div>

      <div className="jp-stagger">
        {/* Name */}
        <JPFormRow label="Name *" placeholder="e.g. Konga" value={name} onChange={setName}/>

        {/* Roaster + dropdown */}
        <div style={{padding:'16px 0',borderBottom:`1px solid ${jp.rule}`,position:'relative',zIndex:showDrop?200:1}}>
          <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3,marginBottom:4}}>Roaster</div>
          <input
            type="text" value={roaster}
            onChange={e=>{setRoaster(e.target.value);setShowDrop(true);}}
            onFocus={()=>setShowDrop(true)}
            onBlur={()=>setTimeout(()=>setShowDrop(false),200)}
            placeholder="e.g. Onibus Coffee"
            style={{width:'100%',border:'none',background:'transparent',fontFamily:jp.serif,fontSize:19,color:jp.ink,padding:0}}
          />
          {showDrop && filtered.length>0 && (
            <div style={{position:'absolute',left:0,right:0,top:'100%',zIndex:200,background:jp.card,border:`1px solid ${jp.rule}`,borderRadius:2,boxShadow:'0 4px 16px rgba(0,0,0,.15)'}}>
              {filtered.map(r=>(
                <div key={r} onPointerDown={e=>{e.preventDefault();setRoaster(r);setShowDrop(false);}}
                  style={{padding:'11px 14px',fontFamily:jp.serif,fontSize:17,color:jp.ink,cursor:'pointer',borderBottom:`1px solid ${jp.rule}`}}>{r}</div>
              ))}
            </div>
          )}
        </div>

        {/* Roast Date */}
        <JPFormRow label="Roast Date" placeholder="" value={roastDate} onChange={setRoastDate} type="date"/>

        {/* Roast Level */}
        <div style={{padding:'16px 0',borderBottom:`1px solid ${jp.rule}`}}>

            {ROAST_LEVELS.map(lv=>{

          {notes.length>0 && (
            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}}>
              {notes.map(n=>(
                <span key={n} onClick={()=>setNotes(ns=>ns.filter(x=>x!==n))} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:20,cursor:'pointer',border:`1px solid ${jp.rule}`,background:jp.card,fontFamily:jp.serif,fontSize:14,color:jp.ink,fontStyle:'italic'}}>

              style={{width:'100%',border:'none',background:'transparent',fontFamily:jp.serif,fontSize:19,color:jp.ink,padding:0}}/>
          </div>

// ─── Search overlay ──────────────────────────────────────────────────────────
function JPSearch({ beans, onPick, onClose }) {
  const [query, setQuery] = React.useState('');
  const q = query.toLowerCase().trim();
  const results = q
    ? beans.filter(b =>
        b.name.toLowerCase().includes(q) ||
        b.origin.toLowerCase().includes(q) ||
        b.roaster.toLowerCase().includes(q) ||
        b.region.toLowerCase().includes(q) ||
        b.notes.some(n=>n.toLowerCase().includes(q))
      )
    : beans;

  const inputRef = React.useRef(null);
  React.useEffect(()=>{ setTimeout(()=>inputRef.current&&inputRef.current.focus(), 80); },[]);

      {/* Search bar */}
      <div style={{
        paddingTop:56,borderBottom:`1px solid ${jp.rule}`,
        display:'flex',alignItems:'center',gap:12,padding:'56px 24px 14px',

      }}>

          <circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/>
        </svg>
        <input
          ref={inputRef}
          value={query}
          onChange={e=>setQuery(e.target.value)}

            flex:1,border:'none',background:'transparent',

          }}
        />
        <button onClick={onClose} style={{
          background:'transparent',border:'none',cursor:'pointer',
          fontFamily:jp.sans,fontSize:13,color:jp.ink,padding:0,flexShrink:0,
        }}>Cancel</button>
      </div>

      {/* Results */}
      <div style={{flex:1,overflowY:'auto'}}>
        {!q && (
          <div style={{padding:'12px 24px 4px',fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3}}>
            All beans
          </div>

        {q && results.length===0 && (
          <div style={{padding:'64px 24px',textAlign:'center',fontFamily:jp.serif,fontStyle:'italic',fontSize:18,color:jp.ink3}}>
            Nothing found
          </div>
        )}
        {results.map(bean=>{
          const r = roastInfo(bean.roastDate);
          return (
            <div key={bean.id} onClick={()=>onPick(bean.id)} className="jp-tap" style={{
              display:'flex',gap:16,padding:'16px 24px',
              borderBottom:`1px solid ${jp.rule}`,cursor:'pointer',alignItems:'center',
            }}>
              <JPBeanPhoto bean={bean} size={44}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:jp.serif,fontSize:19,color:jp.ink,lineHeight:1.2}}>{bean.name}</div>

              </div>
              <JPStatusPill status={r.status} label={r.label} small/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Log brew sheet ──────────────────────────────────────────────────────────

    suggest ? String(suggest.suggested) :
    bean.brews.length>0 ? bean.brews[0].grind : ''

  const pg = pricePerGram(bean);

              fontFamily:jp.serif,fontSize:36,color:jp.ink,padding:0,
            }}

            value={grind} onChange={e=>setGrind(e.target.value)}

// ─── Edit bean sheet ────────────────────────────────────────────────────────
const ROAST_LEVELS = ['Light','Light-Med','Medium','Medium-Dark','Dark'];

function JPEditBeanSheet({ bean, allRoasters, onSave, onClose }) {
  const [name,       setName]       = React.useState(bean.name);
  const [roaster,    setRoaster]    = React.useState(bean.roaster === '—' ? '' : bean.roaster);
  const [roastLevel, setRoastLevel] = React.useState(bean.roastLevel === '—' ? '' : bean.roastLevel);
  const [notes,      setNotes]      = React.useState([...(bean.notes || [])]);
  const [noteInput,  setNoteInput]  = React.useState('');
  const [showDrop,   setShowDrop]   = React.useState(false);

  const filtered = allRoasters.filter(r =>
    r.toLowerCase().includes(roaster.toLowerCase()) && r.toLowerCase() !== roaster.toLowerCase()
  );

  const addNote = () => {
    const v = noteInput.trim().replace(/^#/, '').replace(/,/g, '').trim();
    if (v && !notes.find(n => n.toLowerCase() === v.toLowerCase())) setNotes(ns => [...ns, v]);
    setNoteInput('');
  };

  const save = () => {
    if (!name.trim()) return;
    onSave({ ...bean, name: name.trim(), roaster: roaster.trim() || '—', roastLevel: roastLevel || '—', notes });
  };

  const inBase = { width:'100%', border:'none', background:'transparent', fontFamily:jp.serif, color:jp.ink, padding:0 };

  return (
    <div style={{position:'absolute',inset:0,zIndex:20}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(26,22,20,.45)',backdropFilter:'blur(2px)'}}/>
      <div className="jp-enter-up jp-paper" style={{
        position:'absolute',bottom:0,left:0,right:0,
        borderRadius:'12px 12px 0 0',padding:'28px 24px 48px',
        maxHeight:'88vh',overflowY:'auto',
      }}>
        <div style={{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:36,height:4,borderRadius:2,background:jp.rule}}/>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:24}}>
          <div>
            <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3}}>Edit Bean</div>
            <div style={{fontFamily:jp.serif,fontSize:22,color:jp.ink,marginTop:4,letterSpacing:-.2}}>{bean.name}</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none',fontSize:22,color:jp.ink3,lineHeight:1,cursor:'pointer'}}>×</button>
        </div>

        {/* Name */}
        <div style={{borderBottom:`1px solid ${jp.rule}`,paddingBottom:12,marginBottom:16}}>
          <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3,marginBottom:6}}>Name *</div>
          <input
            type="text" value={name} onChange={e=>setName(e.target.value)}
            placeholder="e.g. Konga"
            style={{...inBase,fontSize:24}}
          />
        </div>

        {/* Roaster dropdown */}
        <div style={{borderBottom:`1px solid ${jp.rule}`,paddingBottom:12,marginBottom:16,position:'relative',zIndex:showDrop?200:1}}>
          <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3,marginBottom:6}}>Roaster</div>
          <input
            type="text" value={roaster}
            onChange={e=>{ setRoaster(e.target.value); setShowDrop(true); }}
            onFocus={()=>setShowDrop(true)}
            onBlur={()=>setTimeout(()=>setShowDrop(false),200)}
            placeholder="e.g. Onibus Coffee"
            style={{...inBase,fontSize:22}}
          />
          {showDrop && filtered.length > 0 && (
            <div style={{
              position:'absolute',left:0,right:0,top:'100%',zIndex:200,
              background:jp.card,border:`1px solid ${jp.rule}`,borderRadius:2,
              boxShadow:'0 4px 16px rgba(0,0,0,.15)',
            }}>
              {filtered.map(r => (
                <div key={r} onPointerDown={e=>{e.preventDefault();setRoaster(r);setShowDrop(false);}} style={{
                  padding:'11px 14px',fontFamily:jp.serif,fontSize:17,color:jp.ink,cursor:'pointer',
                  borderBottom:`1px solid ${jp.rule}`,
                }}>{r}</div>
              ))}
            </div>
          )}
        </div>

        {/* Roast level pills */}
        <div style={{marginBottom:20}}>
          <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3,marginBottom:10}}>Roast Level</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {ROAST_LEVELS.map(lv => {
              const sel = roastLevel === lv;
              return (
                <button key={lv} onClick={()=>setRoastLevel(sel ? '' : lv)} style={{
                  padding:'6px 16px',borderRadius:20,cursor:'pointer',
                  border:`1px solid ${sel ? jp.ink : jp.rule}`,
                  background: sel ? jp.ink : 'transparent',
                  color: sel ? jp.paper : jp.ink2,
                  fontFamily:jp.sans,fontSize:12,letterSpacing:1.2,
                }}>
                  {lv}
                </button>
              );
            })}
          </div>
        </div>

        {/* Tasting notes */}
        <div style={{marginBottom:28}}>
          <div style={{fontFamily:jp.sans,fontSize:10,letterSpacing:2,textTransform:'uppercase',color:jp.ink3,marginBottom:10}}>Tasting Notes</div>
          {notes.length > 0 && (
            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:12}}>
              {notes.map(n => (
                <span key={n} onClick={()=>setNotes(ns=>ns.filter(x=>x!==n))} style={{
                  display:'inline-flex',alignItems:'center',gap:5,
                  padding:'5px 12px',borderRadius:20,cursor:'pointer',
                  border:`1px solid ${jp.rule}`,background:jp.card,
                  fontFamily:jp.serif,fontSize:14,color:jp.ink,fontStyle:'italic',

                  {n}<span style={{color:jp.ink3,fontSize:10,lineHeight:1,fontStyle:'normal'}}>×</span>

              ))}
            </div>
          )}
          <div style={{display:'flex',gap:8,alignItems:'center',borderBottom:`1px solid ${jp.rule}`,paddingBottom:8}}>
            <span style={{fontFamily:jp.mono,fontSize:13,color:jp.ink3}}>#</span>
            <input
              type="text" value={noteInput}
              onChange={e=>setNoteInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter'||e.key===','){e.preventDefault();addNote();} }}
              placeholder="jasmine · enter to add"
              style={{flex:1,border:'none',background:'transparent',fontFamily:jp.serif,fontSize:17,color:jp.ink,padding:0,fontStyle:'italic'}}
            />
            <button onPointerDown={e=>{e.preventDefault();addNote();}} style={{
              background:'transparent',border:'none',cursor:'pointer',
              fontFamily:jp.sans,fontSize:11,color:jp.ink3,letterSpacing:1.2,textTransform:'uppercase',flexShrink:0,
            }}>Add</button>
          </div>
        </div>

        <button onClick={save} className="jp-tap" style={{
          width:'100%',height:54,
          background:name.trim()?jp.ink:'rgba(26,22,20,.2)',
          color:jp.paper,border:'none',borderRadius:2,cursor:'pointer',
          fontFamily:jp.sans,fontSize:12,letterSpacing:3,textTransform:'uppercase',
          transition:'background .2s',
        }}>Save Changes</button>
      </div>
    </div>
  );
}

// ─── App root ────────────────────────────────────────────────────────────────
function AppJapandi() {
  const [beans, setBeans] = React.useState(() => {
    try {
      const s = localStorage.getItem('thegrind-beans');
      return s ? JSON.parse(s) : INITIAL_BEANS;
    } catch { return INITIAL_BEANS; }
  });
  const [view,  setView]  = React.useState({ name:'home', bean:null });
  const [adding,      setAdding]      = React.useState(false);
  const [searching,   setSearching]   = React.useState(false);
  const [logBrewFor,  setLogBrewFor]  = React.useState(null);
  const [refreshFor,  setRefreshFor]  = React.useState(null);
  const [editBrewFor, setEditBrewFor] = React.useState(null);
  const [editBeanFor, setEditBeanFor] = React.useState(null);
  const [syncing,     setSyncing]     = React.useState(false);
  const skipSave = React.useRef(false);
  const saveTimer = React.useRef(null);

  // Load from Supabase on mount + real-time listener
  React.useEffect(() => {
    sb.from('grind_data').select('beans').eq('id', 1).single()
      .then(({ data }) => {
        if (data?.beans?.length) { skipSave.current = true; setBeans(data.beans); }
      }).catch(() => {});

    const ch = sb.channel('grind')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'grind_data' }, ({ new: row }) => {
        if (row?.beans) { skipSave.current = true; setBeans(row.beans); }
      })
      .subscribe();

    return () => sb.removeChannel(ch);
  }, []);

  // Save to Supabase + localStorage on every change (debounced)
  React.useEffect(() => {
    try { localStorage.setItem('thegrind-beans', JSON.stringify(beans)); } catch {}
    if (skipSave.current) { skipSave.current = false; return; }
    clearTimeout(saveTimer.current);
    setSyncing(true);
    saveTimer.current = setTimeout(async () => {
      try {
        await sb.from('grind_data').upsert({ id: 1, beans, updated_at: new Date().toISOString() });
      } catch (e) { console.error('Supabase save failed', e); }
      setSyncing(false);
    }, 1000);
  }, [beans]);

  const open = id => setView({ name:'detail', bean:id });

  const addBrew = (beanId, dose, grind, note='', date=todayISO()) => {
    setBeans(bs => bs.map(b => b.id!==beanId ? b : {
      ...b,
      brews: [{ id:'br-'+(++_brewId), date, dose, grind, note }, ...b.brews]
        .sort((a,b) => b.date.localeCompare(a.date)),
      gramsLeft: Math.max(0, b.gramsLeft - dose),
    }));
    setLogBrewFor(null);
  };

  const saveEditBrew = (beanId, updated) => {
    setBeans(bs => bs.map(b => {
      if (b.id!==beanId) return b;
      const newBrews = b.brews.map(br=>br.id===updated.id?updated:br);
      const used = newBrews.reduce((s,br)=>s+br.dose,0);
      return { ...b, brews:newBrews, gramsLeft:Math.max(0,b.weightBought-used) };
    }));
    setEditBrewFor(null);
  };

  const deleteBrewEntry = (beanId, brewId) => {
    setBeans(bs => bs.map(b => {
      if (b.id!==beanId) return b;
      const newBrews = b.brews.filter(br=>br.id!==brewId);
      const used = newBrews.reduce((s,br)=>s+br.dose,0);
      return { ...b, brews:newBrews, gramsLeft:Math.max(0,b.weightBought-used) };
    }));
    setEditBrewFor(null);
  };

  const exportData = async () => {
    const json = JSON.stringify(beans, null, 2);
    const filename = `thegrind-${todayISO()}.json`;
    if (navigator.share && navigator.canShare) {
      try {
        const file = new File([json], filename, {type:'application/json'});
        if (navigator.canShare({files:[file]})) {
          await navigator.share({files:[file], title:'The Grind Backup'});
          return;
        }
      } catch {}
    }
    const blob = new Blob([json],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const updateRating = (beanId, rating) => {
    setBeans(bs => bs.map(b => b.id!==beanId ? b : {...b, rating}));
  };

  const deleteBean = (beanId) => {
    setBeans(bs => bs.filter(b => b.id !== beanId));
    setView({ name:'home', bean:null });
  };

  const refreshBag = (beanId, newBagData) => {
    setBeans(bs => bs.map(b => {
      if (b.id !== beanId) return b;
      const archivedBag = {
        id: b.id + '_bag' + Date.now(),
        roastDate:    b.roastDate,
        weightBought: b.weightBought,
        pricePaid:    b.pricePaid,
        gramsUsed:    b.weightBought - b.gramsLeft,
        brews:        b.brews,
      };
      return {
        ...b,
        roastDate:    newBagData.roastDate,
        weightBought: newBagData.weightBought,
        pricePaid:    newBagData.pricePaid,
        gramsLeft:    newBagData.weightBought,
        brews:        [],
        bags:         [...(b.bags || []), archivedBag],
      };
    }));
    setRefreshFor(null);
  };

  const saveBeanEdits = (updated) => {
    setBeans(bs => bs.map(b => b.id === updated.id ? updated : b));
    setEditBeanFor(null);
  };

  const addBean = (data) => {
    const id = 'b' + Date.now();
    const newBean = {
      id,
      name:         data.name,
      origin:       data.origin  || '—',
      region:       data.region  || '—',
      roaster:      data.roaster || '—',
      process:      data.process || '—',
      varietal:     '—',
      altitude:     '—',
      roastLevel:   data.roastLevel || '—',
      roastDate:    data.roastDate,
      rating:       data.rating,
      notes:        data.notes  || [],
      description:  '',
      tone:         ['#c89878','#5a3820'],
      gramsLeft:    data.gramsLeft,
      weightBought: data.weightBought,
      pricePaid:    data.pricePaid,
      brews:        [],
      imageUrl:     data.imageUrl || null,
    };
    setBeans(bs => [newBean, ...bs]);
    setAdding(false);
  };

  const currentBean = view.bean ? beans.find(b=>b.id===view.bean) : null;

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden',background:jp.paper}}>
      {/* Home / Detail screens */}
      <div className={view.name==='detail'?'jp-screen jp-enter-right':'jp-screen'} key={view.name}>
        {view.name==='home'
          ? <JPHome beans={beans} onOpen={open} onAdd={()=>setAdding(true)} onSearch={()=>setSearching(true)} onExport={exportData} syncing={syncing}/>
          : <JPDetail bean={currentBean} onBack={()=>setView({name:'home',bean:null})} onLogBrew={()=>setLogBrewFor(currentBean.id)} onRefreshBag={()=>setRefreshFor(currentBean.id)} onEditBrew={brew=>setEditBrewFor({beanId:currentBean.id,brew})} onDelete={()=>deleteBean(currentBean.id)} onRatingChange={r=>updateRating(currentBean.id,r)} onEditBean={()=>setEditBeanFor(currentBean.id)}/>
        }
      </div>

      {/* Overlays */}
      {adding    && <JPAddFlow onClose={()=>setAdding(false)} onAddBean={addBean} allRoasters={[...new Set(beans.map(b=>b.roaster).filter(r=>r&&r!=='—'))].sort()}/>}
      {searching && <JPSearch beans={beans} onPick={id=>{setSearching(false);open(id);}} onClose={()=>setSearching(false)}/>}
      {logBrewFor && (
        <JPLogBrewSheet
          bean={beans.find(b=>b.id===logBrewFor)}
          onSave={(dose,grind,note,date)=>addBrew(logBrewFor,dose,grind,note,date)}
          onClose={()=>setLogBrewFor(null)}
        />
      )}
      {editBrewFor && (
        <JPEditBrewSheet
          brew={editBrewFor.brew}
          bean={beans.find(b=>b.id===editBrewFor.beanId)}
          onSave={updated=>saveEditBrew(editBrewFor.beanId,updated)}
          onDelete={()=>deleteBrewEntry(editBrewFor.beanId,editBrewFor.brew.id)}
          onClose={()=>setEditBrewFor(null)}
        />
      )}
      {refreshFor && (
        <JPRefreshBagSheet
          bean={beans.find(b=>b.id===refreshFor)}
          onRefresh={(data)=>refreshBag(refreshFor,data)}
          onClose={()=>setRefreshFor(null)}
        />
      )}
      {editBeanFor && (
        <JPEditBeanSheet
          bean={beans.find(b=>b.id===editBeanFor)}
          allRoasters={[...new Set(beans.map(b=>b.roaster).filter(r=>r&&r!=='—'))].sort()}
          onSave={saveBeanEdits}
          onClose={()=>setEditBeanFor(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppJapandi/>);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    const reg = await navigator.serviceWorker.register('./sw.js');
    // Check for SW updates every time the app is opened
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      newSW.addEventListener('statechange', () => {
        // New SW installed and activated — reload to use it
        if (newSW.state === 'activated' && navigator.serviceWorker.controller) {
          window.location.reload();
        }
      });
    });
  });
}
</script>
</body>
</html>
